<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salvadanaio</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json?v=9">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salvadanaio">
<script>
/* Si mette in ascolto subito, prima di tutto il resto, così il permesso di installare non va perso */
window.__bip=null;
addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna stile app mobile; testata col totale, selettore salvadanaio, monete grandi da toccare, storico sotto */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#15212e; --muted:#5b6b7c; --line:#d6dee7;
  --navy:#1f3a5f; --brass:#c4952f; --copper:#b5653d; --good:#2e7d4f; --danger:#b3362f; --cash:#2f7d6b;
  --tile:#f6f8fb;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* metalli */
  --gold-a:#f3d77a; --gold-b:#b98a25; --silver-a:#f1f3f5; --silver-b:#9aa3ad; --cu-a:#e9a079; --cu-b:#8f4626;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#17222e; --ink:#e7edf3; --muted:#93a3b4; --line:#273544;
  --navy:#8fb3dc; --brass:#e0b453; --copper:#e08a5f; --good:#5fc58a; --danger:#ef7a70; --cash:#5cc4a9; --tile:#1d2a37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17222e; --ink:#e7edf3; --muted:#93a3b4; --line:#273544;
  --navy:#8fb3dc; --brass:#e0b453; --copper:#e08a5f; --good:#5fc58a; --danger:#ef7a70; --cash:#5cc4a9; --tile:#1d2a37; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

header{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eye{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--navy)}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.install{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px;background:var(--navy);color:var(--bg);font-weight:700;font-size:15px}
.install svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grand{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}

.banner{background:var(--tile);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.banner button{background:var(--navy);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--tile);border:1px solid var(--line);padding:5px;border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-width:0}
.seg button .n{font-weight:600;font-size:14px;line-height:1.2;max-width:100%}
.seg button .v{font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-b="grandi"][aria-selected="true"] .n{color:var(--brass)}
.seg button[data-b="piccole"][aria-selected="true"] .n{color:var(--copper)}
.seg button[data-b="banconote"][aria-selected="true"] .n{color:var(--cash)}

.bank{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.bank-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bank-name{font-family:var(--f-display);font-weight:600;font-size:20px;border:0;background:transparent;padding:0;text-align:left;border-bottom:1px dashed transparent;min-width:0}
.bank-name:hover{border-bottom-color:var(--muted)}
.bank-total{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.01em}
.accent{color:var(--acc)}
.bank-meta{font-size:13px;color:var(--muted)}

.goal{display:flex;flex-direction:column;gap:6px}
.goal-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.goal-row button{border:0;background:none;padding:0;color:var(--navy);font-weight:600;font-size:13px}
.bar{height:10px;border-radius:999px;background:var(--tile);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .35s ease}

.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--tile);border-radius:16px;padding:14px 6px 10px;min-width:0}
.coin{--d:80px;width:var(--d);height:var(--d);border-radius:50%;border:0;display:grid;place-items:center;position:relative;
  font-family:var(--f-display);font-weight:800;color:#3b2a08;font-size:calc(var(--d)*.24);letter-spacing:-.02em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.18);transition:transform .08s}
.coin:active{transform:scale(.92)}
.coin.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.08)}}
.coin small{font-size:.6em;margin-left:1px;font-family:var(--f-body);font-weight:800}
.m-gold{background:radial-gradient(circle at 35% 30%,var(--gold-a),var(--gold-b))}
.m-cu{background:radial-gradient(circle at 35% 30%,var(--cu-a),var(--cu-b));color:#3a1606}
/* 1 €: anello argento, centro oro — 2 €: anello oro, centro argento */
.m-1e{background:radial-gradient(circle at 35% 30%,var(--gold-a),var(--gold-b) 58%,transparent 59%),radial-gradient(circle at 35% 30%,var(--silver-a),var(--silver-b))}
.m-2e{background:radial-gradient(circle at 35% 30%,var(--silver-a),var(--silver-b) 58%,transparent 59%),radial-gradient(circle at 35% 30%,var(--gold-a),var(--gold-b));color:#2a2f35}
.count{font-weight:700;font-size:18px}
.count span{font-weight:500;font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:6px;align-items:center}
.minus{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.minus:disabled{opacity:.35;cursor:default}
.qty{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--acc);background:var(--surface);color:var(--acc);font-weight:700;font-size:13px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{flex:1;min-width:52px;border:1px solid var(--line);background:var(--tile);border-radius:10px;padding:9px 0;font-weight:600}
.preview{font-size:14px;color:var(--ink);font-weight:600}
.csub{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:-6px 0 0}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px}
.btn.danger{color:var(--danger)}

section h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:20px;font-family:var(--f-display);font-weight:600}
.stat span{font-size:12px;color:var(--muted)}

.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--brass)}
.dot.p{background:var(--copper)}
.hist .what{flex:1;min-width:0}
.hist .when{color:var(--muted);font-size:12px;white-space:nowrap}
.hist .neg{color:var(--danger)}
.hist .open{color:var(--good);font-weight:600}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;font-size:14px;transition:transform .25s;width:max-content;max-width:calc(100% - 32px);z-index:5}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{background:var(--brass);color:#1b1404;border:0;border-radius:999px;padding:6px 12px;font-weight:700}

.modal{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.sheet label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sheet input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--ink);width:100%}
.sheet .row{display:flex;gap:10px;justify-content:flex-end}
.btn.primary{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.btn.primary.danger{background:var(--danger);border-color:var(--danger);color:#fff}

/* banconote: rettangoli con i colori delle vere banconote in euro */
.note{width:100%;max-width:96px;aspect-ratio:2/1.08;border:0;border-radius:6px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:5px 7px;color:#fff;
  background:linear-gradient(135deg,var(--nc) 0%,var(--nc2) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.18);transition:transform .08s}
.note::after{content:"";position:absolute;right:-14%;top:-30%;width:62%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18)}
.note:active{transform:scale(.93)}
.note.pop{animation:pop .3s}
.note .nv{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;position:relative;z-index:1}
.note .ne{font-size:9px;letter-spacing:.14em;font-weight:700;opacity:.85;position:relative;z-index:1}
.n5{--nc:#8f9ba3;--nc2:#5f6d77}
.n10{--nc:#d9655a;--nc2:#a63b33}
.n20{--nc:#5b86c9;--nc2:#2f5a99}
.n50{--nc:#ee9a4a;--nc2:#c06a1e}
.n100{--nc:#5fae6b;--nc2:#2f7d3d}
.n200{--nc:#e6c24f;--nc2:#b48d1c;color:#3a2c05}
/* previsione obiettivo */
.forecast{font-size:13px;color:var(--ink);background:var(--tile);border-radius:10px;padding:8px 10px}
.forecast b{color:var(--acc)}
/* grafico andamento */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sec-head h2{margin:0}
.mini-seg{display:flex;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.mini-seg button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{font:11px var(--f-body);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .cbar{fill:var(--navy);opacity:.35}
.chart .cbar.now{fill:var(--brass);opacity:1}
.chart-note{font-size:13px;color:var(--muted);padding:2px 6px 6px}
.chart-empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}
/* prelievo */
.wrows{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.wrow{display:grid;grid-template-columns:1fr auto 34px 32px 34px;align-items:center;gap:8px;padding:6px 8px;background:var(--tile);border-radius:10px}
.wrow .wl{font-weight:700}
.wrow .wa{font-size:12px;color:var(--muted)}
.wrow b{text-align:center}
.wrow button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px}
.wrow button:disabled{opacity:.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.hist .wd{color:var(--ink);font-weight:600}
.hist .why{color:var(--muted);font-weight:400}
/* impostazioni */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.set-item{padding:14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.set-item:first-child{border-top:0}
.set-item b{display:block;font-size:15px}
.set-item span{font-size:13px;color:var(--muted)}
.set-item .warn{color:var(--danger)}
/* blocco PIN */
.lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-in{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px}
.lock-coin{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 30px var(--f-display);color:#3b2a08;background:radial-gradient(circle at 35% 30%,var(--gold-a),var(--gold-b))}
.lock h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px}
.pins{display:flex;gap:14px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pins i.on{background:var(--ink);border-color:var(--ink)}
.pins.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock-msg{margin:0;font-size:13px;color:var(--danger);min-height:18px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 24px var(--f-body)}
.pad button.ghost{border:0;background:none;font-size:14px;color:var(--muted)}
.lock-forgot{border:0;background:none;color:var(--navy);font-weight:600;font-size:14px;padding:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.coin{--d:66px!important}}

*,*::before,*::after{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><div class="eyebrow">Totale nei salvadanai</div><button class="eye" id="eye"></button></div>
    <div class="grand num" id="grand">0,00 €</div>
    <div class="sub num" id="grandSub"></div>
  </header>

  <button class="install" id="install" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Installa l'app sul telefono</button>

  <div class="banner" id="exBanner" hidden>
    <span>Stai vedendo dati di esempio.</span>
    <button id="startFresh">Inizia da zero</button>
  </div>

  <div class="seg" role="tablist" id="seg"></div>

  <div class="bank" id="bank"></div>

  <section>
    <h2>Statistiche</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Andamento</h2>
      <div class="mini-seg"><button data-cm="w" id="cmW">Settimane</button><button data-cm="m" id="cmM">Mesi</button></div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section>
    <h2>Storico</h2>
    <ul class="hist" id="hist"></ul>
  </section>

  <section>
    <h2>Impostazioni</h2>
    <div class="settings" id="settings"></div>
    <input type="file" id="restoreFile" accept=".json,.txt,application/json,text/plain" hidden>
  </section>
</div>

<div class="lock" id="lock" hidden>
  <div class="lock-in">
    <div class="lock-coin">€</div>
    <h3 id="lockTitle">Inserisci il PIN</h3>
    <div class="pins" id="pins"><i></i><i></i><i></i><i></i></div>
    <p class="lock-msg" id="lockMsg"></p>
    <div class="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="x" class="ghost" id="padX">Annulla</button><button data-k="0">0</button><button data-k="del" class="ghost" aria-label="Cancella">⌫</button>
    </div>
    <button class="lock-forgot" id="forgot">PIN dimenticato?</button>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">Annulla</button></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
const KEY='salvadanaio-v1';
const COINS={grandi:[50,100,200],piccole:[5,10,20],banconote:[500,1000,2000,5000,10000,20000]};
const BANKS=['grandi','piccole','banconote'];
const ACC={grandi:'var(--brass)',piccole:'var(--copper)',banconote:'var(--cash)'};
const isNote=b=>b==='banconote';
const noun=(b,n)=>isNote(b)?(n===1?'banconota':'banconote'):(n===1?'moneta':'monete');
const SIZE={200:86,100:78,50:82,20:76,10:68,5:72};
const METAL={200:'m-2e',100:'m-1e',50:'m-gold',20:'m-gold',10:'m-gold',5:'m-cu'};
const fmt=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const eur=c=>S&&S.hide?'••••• €':fmt.format(c/100);
const pz=n=>S&&S.hide?'••':n;
const EYE_ON='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const coinLabel=c=>c>=100?(c/100)+' €':c+' cent';

function fresh(){return{example:false,cur:'grandi',banks:{
  grandi:{name:'Monete grandi',goal:20000,coins:{50:0,100:0,200:0}},
  piccole:{name:'Monete piccole',goal:3000,coins:{5:0,10:0,20:0}},
  banconote:{name:'Banconote',goal:50000,coins:{500:0,1000:0,2000:0,5000:0,10000:0,20000:0}}},
  log:[],opens:[]};}

function example(){
  const s=fresh();s.example=true;
  s.banks.grandi.coins={50:14,100:23,200:9};

/* ---------- Previsione obiettivo ---------- */
function forecast(b,missing){
  const now=Date.now(),mine=S.log.filter(l=>l.b===b);
  if(!mine.length)return'Aggiungi qualche moneta e ti dico quando arrivi all’obiettivo.';
  const first=Math.min(...mine.map(l=>l.t));
  const span=Math.min(30,Math.max(7,(now-first)/864e5));
  const saved=mine.filter(l=>l.t>=now-span*864e5).reduce((a,l)=>a+l.c*l.d,0);
  if(saved<=0)return'Nell’ultimo periodo non hai aggiunto niente: riprendi a risparmiare per vedere la previsione.';
  const days=Math.ceil(missing/(saved/span));
  if(days>3650)return'Al ritmo attuale ci vorranno più di 10 anni.';
  const d=new Date(now+days*864e5),same=d.getFullYear()===new Date().getFullYear();
  const when=d.toLocaleDateString('it-IT',same?{day:'numeric',month:'long'}:{day:'numeric',month:'long',year:'numeric'});
  return`Al tuo ritmo arrivi all’obiettivo verso il <b>${when}</b>`+(days<=1?' (domani!)':` (tra ${days} giorni)`);
}

/* ---------- Grafico andamento ---------- */
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function renderChart(){
  const m=S.chart==='m';
  $('cmW').setAttribute('aria-pressed',!m);$('cmM').setAttribute('aria-pressed',m);
  if(S.hide){$('chart').innerHTML='<div class="chart-empty">Cifre nascoste</div>';return}
  const n=m?12:12,buckets=[],now=new Date();
  for(let i=n-1;i>=0;i--){
    let s,e,label;
    if(m){const d=new Date(now.getFullYear(),now.getMonth()-i,1);s=d.getTime();e=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
      label=d.toLocaleDateString('it-IT',{month:'short'}).replace('.','');}
    else{s=weekStart(now)-i*7*864e5;e=s+7*864e5;const d=new Date(s);label=d.getDate()+'/'+(d.getMonth()+1);}
    buckets.push({s,e,label,v:0});
  }
  S.log.forEach(l=>{const k=buckets.find(x=>l.t>=x.s&&l.t<x.e);if(k)k.v+=l.c*l.d;});
  buckets.forEach(k=>k.v=Math.max(0,k.v));
  const max=Math.max(...buckets.map(k=>k.v));
  if(!max){$('chart').innerHTML=`<div class="chart-empty">Ancora niente da mostrare: i risparmi ${m?'di ogni mese':'di ogni settimana'} compariranno qui.</div>`;return}
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));return[1,2,2.5,5,10].map(f=>f*p).find(x=>x>=v)};
  const top=nice(max/100)*100;
  const W=340,H=170,L=44,R=6,T=10,B=24,cw=(W-L-R)/n,ch=H-T-B;
  const y=v=>T+ch-(v/top)*ch;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risparmi ${m?'per mese':'per settimana'}">`;
  [0,top/2,top].forEach(v=>{svg+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt.format(v/100).replace(',00','')}</text>`;});
  buckets.forEach((k,i)=>{
    const x=L+i*cw+cw*.18,w=cw*.64,h=Math.max(k.v?2:0,(k.v/top)*ch);
    svg+=`<rect class="cbar${i===n-1?' now':''}" x="${x}" y="${T+ch-h}" width="${w}" height="${h}" rx="3"><title>${k.label}: ${fmt.format(k.v/100)}</title></rect>`;
    if(i%(m?2:3)===(n-1)%(m?2:3))svg+=`<text class="ax" x="${x+w/2}" y="${H-6}" text-anchor="middle">${k.label}</text>`;
  });
  svg+='</svg>';
  /* la media conta solo i periodi da quando usi l'app */
  const firstT=Math.min(...S.log.map(l=>l.t)),past=buckets.slice(0,-1).filter(k=>k.e>firstT);
  const cur=buckets[n-1].v,prevAvg=past.length?past.reduce((a,k)=>a+k.v,0)/past.length:0;
  $('chart').innerHTML=svg+`<div class="chart-note num">${m?'Questo mese':'Questa settimana'}: <b>${fmt.format(cur/100)}</b> · media ${fmt.format(prevAvg/100)}</div>`;
}

/* PIN: si salva solo un'impronta, mai il PIN in chiaro */
const PINKEY=KEY+'-pin';
const getPin=()=>{try{return localStorage.getItem(PINKEY)}catch(e){return null}};
async function hashPin(p){
  const txt='salvadanaio:'+p;
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))|0;return'x'+h;
}
let lockMode=null,pinBuf='',pinFirst='';
function openLock(mode){
  lockMode=mode;pinBuf='';pinFirst='';
  $('lockTitle').textContent={unlock:'Inserisci il PIN',set1:'Scegli un PIN di 4 cifre',off:'PIN attuale',change:'PIN attuale'}[mode];
  $('padX').style.visibility=mode==='unlock'?'hidden':'visible';
  $('forgot').hidden=mode!=='unlock';
  $('lockMsg').textContent='';drawPins();$('lock').hidden=false;
}
function drawPins(){[...$('pins').children].forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));}
function pinError(msg){$('lockMsg').textContent=msg;pinBuf='';drawPins();const p=$('pins');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');}
async function pinDone(){
  const p=pinBuf,h=await hashPin(p);
  if(lockMode==='unlock'){if(h===getPin()){$('lock').hidden=true;lockMode=null}else pinError('PIN sbagliato, riprova');return}
  if(lockMode==='off'||lockMode==='change'){
    if(h!==getPin())return pinError('PIN sbagliato, riprova');
    if(lockMode==='off'){try{localStorage.removeItem(PINKEY)}catch(e){}$('lock').hidden=true;render();toast('PIN disattivato');return}
    lockMode='set1';pinBuf='';$('lockTitle').textContent='Scegli il nuovo PIN';drawPins();return;
  }
  if(lockMode==='set1'){pinFirst=p;lockMode='set2';pinBuf='';$('lockTitle').textContent='Ripeti il PIN';drawPins();return}
  if(lockMode==='set2'){
    if(p!==pinFirst){lockMode='set1';pinFirst='';$('lockTitle').textContent='Scegli un PIN di 4 cifre';return pinError('I due PIN non coincidono, ricomincia')}
    try{localStorage.setItem(PINKEY,h)}catch(e){}$('lock').hidden=true;lockMode=null;render();toast('PIN attivato');
  }
}

document.addEventListener('visibilitychange',()=>{

});

    modal(`<h3>PIN dimenticato</h3><p>Il PIN non si può recuperare. L’unico modo è cancellare PIN e dati dell’app. Se hai un backup, dopo potrai ripristinarlo da Impostazioni.</p><div class="row"><button class="btn" data-x>Indietro</button><button class="btn primary danger" data-ok>Cancella tutto</button></div>`,
      ()=>{try{localStorage.removeItem(PINKEY)}catch(e){}S=fresh();save();render();toast('Dati e PIN cancellati');});
    $('sheet').querySelector('[data-x]').onclick=()=>{$('modal').hidden=true;openLock('unlock');};
    return;
  }
  if(t.dataset.wp){const c=t.dataset.wp;if((W[c]||0)<S.banks[S.cur].coins[c])W[c]=(W[c]||0)+1;drawW();return}
  if(t.dataset.wm){const c=t.dataset.wm;if(W[c])W[c]--;if(!W[c])delete W[c];drawW();return}
  if(t.dataset.why){wWhy=wWhy===t.dataset.why?'':t.dataset.why;document.querySelectorAll('[data-why]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.why===wWhy));return}
  if(t.dataset.cm){S.chart=t.dataset.cm;save();renderChart();return}
  if(t.id==='withdraw'){openWithdraw();drawW();return}
  if(t.id==='bkSave'){doBackup();return}
  if(t.id==='bkLoad'){$('restoreFile').click();return}
  if(t.id==='pinOn'){openLock('set1');return}
  if(t.id==='pinChange'){openLock('change');return}
  if(t.id==='pinOff'){openLock('off');return}
  if(t.id==='eye'){S.hide=!S.hide;save();render();return}
  if(t.dataset.b){S.cur=t.dataset.b;save();render();return}
  if(t.dataset.add){change(+t.dataset.add,1);return}
  if(t.dataset.sub){change(+t.dataset.sub,-1);return}
  if(t.dataset.step){const i=$('fQty');i.value=(parseInt(i.value)||0)+(+t.dataset.step);i.oninput();return}
  const B=S.banks[S.cur];
  if(t.dataset.qty){const c=+t.dataset.qty;
    const nn=noun(S.cur,2);
    modal(`<h3>${nn[0].toUpperCase()+nn.slice(1)} da ${coinLabel(c)}</h3><p>Quante ne metti nel salvadanaio?</p><label>Numero di ${nn}<input id="fQty" type="number" inputmode="numeric" min="1" max="9999" placeholder="es. 12"></label><div class="steps"><button data-step="1">+1</button><button data-step="5">+5</button><button data-step="10">+10</button><button data-step="20">+20</button></div><div class="preview num" id="qPrev">&nbsp;</div><div class="row"><button class="btn" data-x>Annulla</button><button class="btn primary" data-ok>Aggiungi</button></div>`,
      i=>{const n=parseInt(i.value);if(!(n>0&&n<=9999))return false;setTimeout(()=>change(c,n));});
    const i=$('fQty');i.oninput=()=>{const n=parseInt(i.value);$('qPrev').innerHTML=n>0?`${n} × ${coinLabel(c)} = ${eur(n*c)}`:'&nbsp;'};return}
  if(t.id==='rename')modal(`<h3>Nome del salvadanaio</h3><label>Nome<input id="fName" maxlength="30" value="${esc(B.name)}"></label><div class="row"><button class="btn" data-x>Annulla</button><button class="btn primary" data-ok>Salva</button></div>`,
    i=>{const v=i.value.trim();if(!v)return false;B.name=v;save();render();});
  if(t.id==='setGoal')modal(`<h3>Obiettivo di risparmio</h3><p>Quanto vuoi mettere da parte in “${esc(B.name)}”? Lascia vuoto per nessun obiettivo.</p><label>Importo in euro<input id="fGoal" inputmode="decimal" placeholder="es. 200" value="${B.goal?String(B.goal/100).replace('.',','):''}"></label><div class="row"><button class="btn" data-x>Annulla</button><button class="btn primary" data-ok>Salva</button></div>`,
    i=>{const s=i.value.trim().replace(/\./g,'').replace(',','.');if(!s){B.goal=0}else{const n=parseFloat(s);if(!(n>0))return false;B.goal=Math.round(n*100)}save();render();});
  if(t.id==='empty'){const tot=total(S.cur);modal(`<h3>Svuotare “${esc(B.name)}”?</h3><p>Il conteggio torna a zero. I ${eur(tot)} restano nello storico e nel totale risparmiato da sempre.</p><div class="row"><button class="btn" data-x>Annulla</button><button class="btn primary danger" data-ok>Svuota</button></div>`,
    ()=>{const b=S.cur,prev={...B.coins},o={t:Date.now(),b,a:tot};S.opens.push(o);COINS[b].forEach(c=>B.coins[c]=0);save();render();
      toast('Salvadanaio svuotato',()=>{S.banks[b].coins=prev;S.opens.splice(S.opens.indexOf(o),1);});});}
  if(t.id==='startFresh'){S=fresh();save();render();toast('Pronto: si parte da zero');}
});
document.addEventListener('keydown',e=>{
  if($('lock').hidden)return;
  if(/^[0-9]$/.test(e.key)&&pinBuf.length<4){pinBuf+=e.key;drawPins();if(pinBuf.length===4)setTimeout(pinDone,120);}
  else if(e.key==='Backspace'){pinBuf=pinBuf.slice(0,-1);drawPins();}
});

/* Installazione come app: il pulsante è sempre visibile finché l'app non è installata */
const INST=KEY+'-installata';
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function markInstalled(){try{localStorage.setItem(INST,'1')}catch(e){}$('install').hidden=true;}
function showInstall(){
  let done=false;try{done=localStorage.getItem(INST)==='1'}catch(e){}
  $('install').hidden=isApp()||done;
}
if(isApp())markInstalled();
showInstall();
$('install').onclick=async()=>{
  const ev=window.__bip;
  if(ev){
    ev.prompt();
    try{const r=await ev.userChoice;if(r.outcome==='accepted')markInstalled();}catch(e){}
    window.__bip=null;return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  modal(`<h3>Installa Salvadanaio</h3>${ios
    ?'<p>Su iPhone tocca il tasto <b>Condividi</b> di Safari, poi <b>Aggiungi alla schermata Home</b>.</p>'
    :'<p>Tocca i <b>tre puntini ⋮</b> in alto a destra di Chrome, poi <b>Installa app</b>.</p>'}
    <div class="row"><button class="btn" data-x>Chiudi</button><button class="btn primary" data-ok>Fatto, è installata</button></div>`,
    ()=>{markInstalled();});
};
window.addEventListener('appinstalled',()=>{markInstalled();window.__bip=null;toast('App installata sul telefono');});
if('serviceWorker' in navigator&&window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  /* ogni volta che apri l'app con internet, rinfresca la copia per la modalità aereo */
  if(navigator.onLine)navigator.serviceWorker.ready.then(r=>{try{r.active&&r.active.postMessage('refill')}catch(e){}});
}

render();
if(getPin())openLock('unlock');
</script>
</body>
</html>
